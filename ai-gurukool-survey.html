];

const BANKS = { parent: PARENT, student: STUDENT, teacher: TEACHER };

/* ---------- State ---------- */
let selectedRole = null;
let categories = [];   // list of {name, questions[]}
let stepIndex = 0;     // 0=welcome, 1=comprehension, 2=role, 3..=categories, +1=contact, +1=success
const answers = {};

/* ---------- Helpers ---------- */
function groupByCategory(questions) {
  const map = {};
  const order = [];
  questions.forEach(q => {
    if (!map[q.cat]) { map[q.cat] = []; order.push(q.cat); }
    map[q.cat].push(q);
  });
  return order.map(name => ({ name, questions: map[name] }));
}

function totalSteps() {
  return 3 + categories.length + 2;
}
function updateProgress() {
  const total = totalSteps();
  const pct = Math.min(100, (stepIndex / (total - 1)) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = getStepLabel();
}
function getStepLabel() {
  if (stepIndex === 0) return 'Watch the video';
  if (stepIndex === 1) return 'Quick check';
  if (stepIndex === 2) return 'Choose your role';
  const idx = stepIndex - 3;
  if (idx >= 0 && idx < categories.length) return `${categories[idx].name} — ${idx + 1} of ${categories.length}`;
  if (idx === categories.length) return 'Contact details';
  return 'All done!';
}

/* ---------- Render ---------- */
function render() {
  const c = document.getElementById('content');
  const btns = document.getElementById('buttons');
  c.innerHTML = '';
  btns.innerHTML = '';
  if (stepIndex === 0) renderWelcome(c, btns);
  else if (stepIndex === 1) renderComprehension(c, btns);
  else if (stepIndex === 2) renderRole(c, btns);
  else if (stepIndex - 3 < categories.length) renderCategory(c, btns, stepIndex - 3);
  else if (stepIndex - 3 === categories.length) renderContact(c, btns);
  else renderSuccess(c, btns);
  updateProgress();
}

function renderWelcome(c, btns) {
  c.innerHTML = `
    <div style="text-align:center; margin-bottom:6px;">
      <span class="category-badge">Welcome</span>
    </div>
    <div class="q-label" style="text-align:center; font-size:15px;">Please watch this short video about AI-Gurukool 🙏</div>
    <div class="video-wrap">
      <video id="heroVideo" src="https://ai-gurukool.vercel.app/hero.mp4" autoplay playsinline controls></video>
      <button class="mute-btn" id="muteBtn" type="button">🔊 Mute</button>
    </div>
    <div class="info-box" style="text-align:center;">⏱️ Takes ~5 minutes • Your feedback shapes the future of learning</div>
  `;
  btns.innerHTML = `<div></div><button class="btn-primary" onclick="goNext()">Continue →</button>`;
  const v = document.getElementById('heroVideo');
  const btn = document.getElementById('muteBtn');
  v.muted = false; v.volume = 1;
  v.play().catch(() => { v.muted = true; btn.textContent = '🔇 Unmute'; });
  btn.addEventListener('click', () => {
    v.muted = !v.muted;
    btn.textContent = v.muted ? '🔇 Unmute' : '🔊 Mute';
  });
}

function renderComprehension(c, btns) {
  const opts = [
    'AI-powered personalised learning platform',
    'Online school with AI teachers + human oversight',
    'A tuition/coaching alternative using AI',
    'A parent dashboard for tracking learning',
    'Not sure yet'
  ];
  c.innerHTML = `
    <div class="category-header">
      <span class="category-badge">Quick Check</span>
    </div>
    <div class="questions-wrap">
      <div class="question-block">
        <div class="q-label">Which best describes AI-Gurukool from the video? <span class="required">*</span></div>
        <div class="options" id="comp-opts">
          ${opts.map(o => `<div class="option" data-value="${o}">${o}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
  btns.innerHTML = `<button class="btn-secondary" onclick="goPrev()">← Back</button>
                    <button class="btn-primary" id="nextBtn" onclick="goNext()" ${answers.__comprehension?'':'disabled'}>Next →</button>`;
  document.querySelectorAll('#comp-opts .option').forEach(opt => {
    if (opt.dataset.value === answers.__comprehension) opt.classList.add('selected');
    opt.addEventListener('click', () => {
      document.querySelectorAll('#comp-opts .option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      answers.__comprehension = opt.dataset.value;
      document.getElementById('nextBtn').disabled = false;
      setTimeout(goNext, 300);
    });
  });
}

function renderRole(c, btns) {
  c.innerHTML = `
    <div class="category-header"><span class="category-badge">Choose Your Role</span></div>
    <div class="q-label" style="text-align:center;">I am a... <span class="required">*</span></div>
    <div class="role-cards">
      <div class="role-card ${selectedRole==='parent'?'selected':''}" data-role="parent"><span class="emoji">👨‍👩‍👧</span><div class="name">Parent</div></div>
      <div class="role-card ${selectedRole==='student'?'selected':''}" data-role="student"><span class="emoji">🎓</span><div class="name">Student</div></div>
      <div class="role-card ${selectedRole==='teacher'?'selected':''}" data-role="teacher"><span class="emoji">👩‍🏫</span><div class="name">Teacher</div></div>
    </div>
  `;
  btns.innerHTML = `<button class="btn-secondary" onclick="goPrev()">← Back</button>
                    <button class="btn-primary" id="nextBtn" onclick="goNext()" ${selectedRole?'':'disabled'}>Next →</button>`;
  document.querySelectorAll('.role-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.role-card').forEach(x => x.classList.remove('selected'));
      card.classList.add('selected');
      selectedRole = card.dataset.role;
      categories = groupByCategory(BANKS[selectedRole]);
      document.getElementById('nextBtn').disabled = false;
      setTimeout(goNext, 300);
    });
  });
}

function renderCategory(c, btns, idx) {
  const cat = categories[idx];
  c.innerHTML = `
    <div class="category-header">
      <span class="category-badge">${cat.name}</span>
      <span style="font-size:11px; color:#6b7280;">Section ${idx+1} of ${categories.length}</span>
    </div>
    <div class="questions-wrap" id="qwrap"></div>
  `;
  const wrap = document.getElementById('qwrap');
  cat.questions.forEach(q => wrap.appendChild(buildQuestionBlock(q)));
  btns.innerHTML = `<button class="btn-secondary" onclick="goPrev()">← Back</button>
                    <button class="btn-primary" id="nextBtn" onclick="goNext()" ${categoryReady(cat)?'':'disabled'}>Next →</button>`;
}

function buildQuestionBlock(q) {
  const prev = answers[q.id];
  const block = document.createElement('div');
  block.className = 'question-block';
  const req = q.required ? '<span class="required">*</span>' : '';
  let hint = '';
  if (q.type === 'checkbox') {
    hint = q.max ? `<span class="checkbox-hint">Pick up to ${q.max}</span>` : `<span class="checkbox-hint">Select all that apply</span>`;
  }
  let optsHtml = '';
  if (q.type === 'radio') {
    optsHtml = `<div class="options">${q.options.map(o =>
      `<div class="option ${prev===o?'selected':''}" data-value="${o}">${o}</div>`).join('')}</div>`;
  } else if (q.type === 'checkbox') {
    const prevArr = Array.isArray(prev) ? prev : [];
    optsHtml = `<div class="options">${q.options.map(o =>
      `<div class="option ${prevArr.includes(o)?'selected':''}" data-value="${o}">${o}</div>`).join('')}</div>`;
  } else if (q.type === 'scale') {
    optsHtml = `<div class="scale-inline">${Array.from({length: q.max - q.min + 1}, (_, i) => {
      const v = q.min + i;
      return `<label class="${String(prev)===String(v)?'selected':''}" data-value="${v}">${v}</label>`;
    }).join('')}<span class="scale-hint">${q.minLabel} → ${q.maxLabel}</span></div>`;
  }
  block.innerHTML = `<div class="q-label">${q.label} ${req}${hint}</div>${optsHtml}`;

  if (q.type === 'radio') {
    block.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        block.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        answers[q.id] = opt.dataset.value;
        refreshNext();
      });
    });
  } else if (q.type === 'checkbox') {
    block.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        const val = opt.dataset.value;
        const cur = Array.isArray(answers[q.id]) ? answers[q.id].slice() : [];
        const idx = cur.indexOf(val);
        if (idx >= 0) {
          cur.splice(idx, 1);
          opt.classList.remove('selected');
        } else {
          if (q.max && cur.length >= q.max) return;
          cur.push(val);
          opt.classList.add('selected');
        }
        answers[q.id] = cur;
        refreshNext();
      });
    });
  } else if (q.type === 'scale') {
    block.querySelectorAll('.scale-inline label').forEach(lbl => {
      lbl.addEventListener('click', () => {
        block.querySelectorAll('.scale-inline label').forEach(l => l.classList.remove('selected'));
        lbl.classList.add('selected');
        answers[q.id] = lbl.dataset.value;
        refreshNext();
      });
    });
  }
  return block;
}

function refreshNext() {
  const idx = stepIndex - 3;
  if (idx < 0 || idx >= categories.length) return;
  const cat = categories[idx];
  const btn = document.getElementById('nextBtn');
  if (btn) btn.disabled = !categoryReady(cat);
}

function categoryReady(cat) {
  return cat.questions.every(q => {
    if (!q.required) return true;
    const a = answers[q.id];
    if (q.type === 'checkbox') return Array.isArray(a) && a.length > 0;
    return a !== undefined && a !== '' && a !== null;
  });
}

function renderContact(c, btns) {
  c.innerHTML = `
    <div class="category-header"><span class="category-badge">Almost done 🎉</span></div>
    <div class="questions-wrap">
      <div class="question-block">
        <div class="q-label">Your contact details</div>
        <div class="contact-grid">
          <div class="contact-field">
            <label>Email <span class="required">*</span></label>
            <input type="email" id="email" placeholder="you@example.com" value="${answers.__email || ''}">
          </div>
          <div class="contact-field">
            <label>Full Name (optional)</label>
            <input type="text" id="fullName" placeholder="e.g. Priya Sharma" value="${answers.__name || ''}">
          </div>
          <div class="contact-field">
            <label>Phone/WhatsApp (optional)</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210" value="${answers.__phone || ''}">
          </div>
        </div>
      </div>
      <div class="question-block">
        <div class="q-label">Available for a 15-min follow-up interview? <span class="required">*</span></div>
        <div class="options" id="int-opts">
          <div class="option ${answers.__interview==='Yes'?'selected':''}" data-value="Yes">Yes</div>
          <div class="option ${answers.__interview==='No'?'selected':''}" data-value="No">No</div>
        </div>
      </div>
    </div>
  `;
  btns.innerHTML = `<button class="btn-secondary" onclick="goPrev()">← Back</button>
                    <button class="btn-primary" onclick="submitSurvey()">Submit ✓</button>`;
  document.querySelectorAll('#int-opts .option').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('#int-opts .option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      answers.__interview = opt.dataset.value;
    });
  });
}

function renderSuccess(c, btns) {
  c.innerHTML = `
    <div class="success">
      <div class="check">🎉</div>
      <h2>Thank you! Your voice matters.</h2>
      <p style="margin:8px 0; color:#6b7280; font-size:14px;">Your responses go directly into shaping AI-Gurukool.</p>
      <div class="info-box" style="display:inline-block;">🚀 Help us reach more people</div>
      <div class="share-btns">
        <a href="https://wa.me/?text=Check%20out%20AI-Gurukool%20https://ai-gurukool.vercel.app/" target="_blank">📱 WhatsApp</a>
        <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://ai-gurukool.vercel.app/" target="_blank">💼 LinkedIn</a>
        <a href="https://twitter.com/intent/tweet?text=Check%20out%20AI-Gurukool&url=https://ai-gurukool.vercel.app/" target="_blank">🐦 Twitter</a>
      </div>
    </div>
  `;
  btns.innerHTML = '';
}

/* ---------- Navigation ---------- */
function goNext() {
  if (stepIndex === 1 && !answers.__comprehension) return;
  if (stepIndex === 2 && !selectedRole) return;
  const idx = stepIndex - 3;
  if (idx >= 0 && idx < categories.length) {
    if (!categoryReady(categories[idx])) return;
  }
  stepIndex++;
  render();
}
function goPrev() {
  if (stepIndex === 0) return;
  stepIndex--;
  render();
}

/* ---------- Submit ---------- */
function submitSurvey() {
  const email = document.getElementById('email').value.trim();
  const emailField = document.getElementById('email');
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) { emailField.style.borderColor = '#ef4444'; emailField.focus(); return; }
  if (!answers.__interview) return;

  answers.__email = email;
  answers.__name = document.getElementById('fullName').value.trim();
  answers.__phone = document.getElementById('phone').value.trim();

  const payload = {
    role: selectedRole,
    comprehension: answers.__comprehension,
    contact: { email, name: answers.__name, phone: answers.__phone, interview: answers.__interview },
    answers: Object.fromEntries(Object.entries(answers).filter(([k]) => !k.startsWith('__'))),
    submittedAt: new Date().toISOString()
  };
  console.log('Survey response:', payload);
  const all = JSON.parse(localStorage.getItem('ai_gurukool_responses') || '[]');
  all.push(payload);
  localStorage.setItem('ai_gurukool_responses', JSON.stringify(all));

  stepIndex = 3 + categories.length + 1;
  render();
}

render();
</script>
